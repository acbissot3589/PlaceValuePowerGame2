<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Place Value Adventure - Adapted</title>
<style>
:root {
  --ink:#172033; --muted:#536174; --paper:#fffdf7; --panel:#f5efe0;
  --accent:#6b4eff; --accent2:#e9e1ff; --border:#cfc5ad;
}
* { box-sizing:border-box; }
body { margin:0; background:linear-gradient(#eef2f7,#fff); font-family:Arial,Helvetica,sans-serif; color:var(--ink); }
.app { max-width:900px; margin:0 auto; padding:20px; }
.hero { background:var(--paper); border:2px solid var(--border); border-radius:24px; padding:22px; text-align:center; }
h1 { font-size:clamp(2rem,7vw,3.4rem); line-height:1; margin:14px 0 6px; font-weight:900; }
.ribbon { display:inline-block; background:var(--ink); color:#fff; padding:8px 16px; border-radius:999px; font-weight:900; font-size:.86rem; }
.subtitle { margin:10px auto; color:var(--muted); max-width:700px; line-height:1.5; font-size:1.08rem; }
.namebox { max-width:520px; margin:16px auto 0; text-align:left; }
.namebox label { display:block; font-weight:900; margin-bottom:6px; }
.namebox input { width:100%; padding:12px; border:2px solid var(--border); border-radius:12px; font:inherit; background:#fff; color:var(--ink); }
.stats { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin:18px 0; }
.stat { background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:9px 15px; font-weight:900; }
.progress { height:10px; background:#e8e4da; border-radius:99px; overflow:hidden; margin:16px 0; }
.progressbar { height:100%; width:0; background:var(--accent); transition:width .2s; }
.quest { margin-top:18px; background:var(--paper); border:2px solid var(--border); border-radius:24px; padding:22px; }
.sectiontitle { text-align:center; font-size:1.55rem; font-weight:900; margin:0 0 6px; }
.prompt { text-align:center; color:var(--muted); line-height:1.5; max-width:700px; margin:0 auto 16px; font-size:1.08rem; }
.numbers { display:flex; gap:16px; justify-content:center; align-items:center; flex-wrap:wrap; margin:20px 0; }
.num { font-size:clamp(2.3rem,8vw,4rem); font-weight:900; background:#fff; border:2px solid var(--border); border-radius:18px; padding:16px 25px; min-width:155px; text-align:center; }
.symbol { font-size:2rem; font-weight:900; }
.buttons { display:flex; justify-content:center; gap:12px; flex-wrap:wrap; }
button { font:inherit; font-weight:900; min-height:50px; border:2px solid var(--border); border-radius:13px; background:#fff; padding:10px 18px; cursor:pointer; color:var(--ink); }
button:disabled { opacity:.45; cursor:not-allowed; }
button:focus,input:focus { outline:3px solid var(--accent2); outline-offset:2px; }
.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
.choice { font-size:1.55rem; min-width:90px; }
.feedback { min-height:46px; text-align:center; font-weight:900; font-size:1.1rem; padding:13px; }
.hintbox { background:var(--accent2); border-radius:15px; padding:14px; margin:10px auto; max-width:680px; line-height:1.55; font-size:1.05rem; }
.hidden { display:none; }
.order { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; max-width:620px; margin:18px auto; }
.slot { min-height:72px; border:2px dashed var(--border); border-radius:15px; background:#fff; display:flex; align-items:center; justify-content:center; font-size:1.45rem; font-weight:900; }
.order-buttons { display:flex; justify-content:center; gap:10px; flex-wrap:wrap; }
.order-buttons button { font-size:1.25rem; min-width:95px; }
.results { max-width:720px; margin:0 auto; }
.result-card { background:#fff; border:2px solid var(--border); border-radius:18px; padding:18px; margin:14px 0; }
.result-big { font-size:clamp(2.5rem,9vw,4.5rem); font-weight:900; text-align:center; }
.checklist { text-align:left; max-width:520px; margin:15px auto; }
.checklist label { display:block; padding:10px 0; font-weight:800; }
.result-actions { display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin-top:16px; }
.footer { text-align:center; color:var(--muted); font-size:.9rem; margin-top:16px; }
@media(max-width:560px) {
  .app { padding:10px; } .hero,.quest { padding:16px; }
  .order { grid-template-columns:1fr; } .num { min-width:130px; }
}
@media print {
  body { background:#fff; } .hero { box-shadow:none; }
  .result-actions,.footer { display:none; }
}
</style>
</head>
<body>
<div class="app">
<header class="hero">
  <div class="ribbon">🛡️ ADAPTED PLACE VALUE ADVENTURE</div>
  <h1>PLACE VALUE ADVENTURE</h1>
  <div style="font-weight:900;font-size:1.25rem">THE COMPARISON CHALLENGE</div>
  <p class="subtitle">Use <b>hundreds → tens → ones</b> to compare and order 3-digit numbers. Take one step at a time!</p>
  <div class="namebox">
    <label for="studentName">Adventurer Name</label>
    <input id="studentName" type="text" maxlength="50" placeholder="Type your first name">
  </div>
  <div class="stats">
    <div class="stat" id="challenge">Challenge 0 / 12</div>
    <div class="stat" id="xp">XP: 0</div>
    <div class="stat" id="streak">Streak: 0</div>
  </div>
  <div class="progress"><div class="progressbar" id="bar"></div></div>
</header>

<main class="quest" id="quest" aria-live="polite"></main>
<div class="footer">Remember: <b>Hundreds → Tens → Ones</b></div>
</div>

<script>
const COMPARE = [[214, 241], [305, 350], [426, 462], [517, 571], [603, 630], [708, 780], [325, 352], [480, 408], [691, 619], [254, 245], [730, 703], [816, 861]];
const ORDER = [[214, 241, 198], [305, 350, 325], [426, 462, 406], [517, 571, 501], [603, 630, 612], [708, 780, 718], [325, 352, 305], [480, 408, 450], [691, 619, 601], [254, 245, 250], [730, 703, 713], [816, 861, 806]];
const TOTAL = 12;
let challenge=0, xp=0, streak=0, locked=false, current=null;

function pick(arr) { return arr[Math.floor(Math.random()*arr.length)]; }
function shuffle(arr) { return [...arr].sort(()=>Math.random()-.5); }
function relation(a,b) { return a===b ? "=" : (a>b ? ">" : "<"); }
function safeName(s) {
  return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function hint(a,b) {
  const ah=Math.floor(a/100), bh=Math.floor(b/100);
  const at=Math.floor(a/10)%10, bt=Math.floor(b/10)%10;
  const ao=a%10, bo=b%10;
  if(ah!==bh) return "Compare the <b>hundreds</b>: "+ah+" vs. "+bh+". The greater hundreds digit makes the greater number.";
  if(at!==bt) return "The hundreds match. Compare the <b>tens</b>: "+at+" vs. "+bt+".";
  return "The hundreds and tens match. Compare the <b>ones</b>: "+ao+" vs. "+bo+".";
}
function update() {
  document.getElementById("challenge").textContent="Challenge "+challenge+" / "+TOTAL;
  document.getElementById("xp").textContent="XP: "+xp;
  document.getElementById("streak").textContent="Streak: "+streak;
  document.getElementById("bar").style.width=Math.min(100,challenge/TOTAL*100)+"%";
}
function next() {
  if(challenge>=TOTAL) { finishQuest(); return; }
  challenge++; locked=false; update();
  if(challenge%2===1) {
    const p=pick(COMPARE);
    current={type:"compare",a:p[0],b:p[1]};
    renderCompare();
  } else {
    current={type:"order",nums:pick(ORDER)};
    renderOrder();
  }
}
function renderCompare() {
  const q=document.getElementById("quest"), a=current.a, b=current.b;
  q.innerHTML=
    '<h2 class="sectiontitle">🏰 Challenge '+challenge+': Guard the Gate</h2>'+
    '<p class="prompt">Choose the symbol that makes the statement true.</p>'+
    '<div class="numbers"><div class="num">'+a+'</div><div class="symbol">?</div><div class="num">'+b+'</div></div>'+
    '<div class="buttons"><button class="choice" data-v="&lt;">&lt;</button><button class="choice" data-v="&gt;">&gt;</button><button class="choice" data-v="=">=</button></div>'+
    '<div class="feedback" id="feedback"></div>'+
    '<div class="buttons"><button id="hintBtn">💡 Place Value Hint</button></div>'+
    '<div class="hintbox hidden" id="hintBox"></div>';
  q.querySelectorAll("[data-v]").forEach(btn=>btn.addEventListener("click",()=>checkCompare(btn.dataset.v)));
  q.querySelector("#hintBtn").addEventListener("click",()=>{
    const x=q.querySelector("#hintBox"); x.innerHTML="💡 "+hint(a,b); x.classList.remove("hidden");
  });
}
function checkCompare(got) {
  if(locked)return;
  locked=true;
  const ok=got===relation(current.a,current.b), f=document.getElementById("feedback");
  if(ok){xp+=10; streak++; f.textContent="⭐ Correct! You used place value to open the gate.";}
  else{streak=0; f.textContent="🛡️ Not quite. Compare hundreds first, then tens, then ones.";}
  update(); addContinue();
}
function renderOrder() {
  const q=document.getElementById("quest"), nums=shuffle(current.nums), picked=[];
  q.innerHTML=
    '<h2 class="sectiontitle">🗺️ Challenge '+challenge+': Map the Numbers</h2>'+
    '<p class="prompt">Put the numbers in order from <b>least to greatest</b>.</p>'+
    '<div class="order"><div class="slot">1st</div><div class="slot">2nd</div><div class="slot">3rd</div></div>'+
    '<p class="prompt">Click a number for each space.</p>'+
    '<div class="order-buttons">'+nums.map(n=>'<button data-num="'+n+'">'+n+'</button>').join("")+'</div>'+
    '<div class="feedback" id="feedback"></div>'+
    '<div class="buttons"><button id="hintBtn">💡 Place Value Hint</button></div>'+
    '<div class="hintbox hidden" id="hintBox">💡 Compare hundreds first. If the hundreds match, compare tens. If those match, compare ones.</div>';
  q.querySelectorAll("[data-num]").forEach(btn=>btn.addEventListener("click",()=>{
    if(locked)return;
    const n=Number(btn.dataset.num);
    if(picked.includes(n))return;
    picked.push(n); btn.disabled=true;
    q.querySelectorAll(".slot")[picked.length-1].textContent=n;
    if(picked.length===3){
      locked=true;
      const correct=[...current.nums].sort((a,b)=>a-b);
      const ok=picked.every((v,i)=>v===correct[i]), f=q.querySelector("#feedback");
      if(ok){xp+=10; streak++; f.textContent="⭐ Correct! The treasure map is unlocked.";}
      else{streak=0; f.textContent="🛡️ Not quite. Look at the hundreds first."}
      update(); addContinue();
    }
  }));
  q.querySelector("#hintBtn").addEventListener("click",()=>q.querySelector("#hintBox").classList.remove("hidden"));
}
function addContinue() {
  const wrap=document.createElement("div"); wrap.className="buttons";
  const b=document.createElement("button"); b.className="primary";
  b.textContent=challenge>=TOTAL?"🏆 Finish the Quest":"Continue the Quest →";
  b.addEventListener("click",next); wrap.appendChild(b);
  document.getElementById("quest").appendChild(wrap);
}
function finishQuest() {
  document.getElementById("bar").style.width="100%";
  const raw=(document.getElementById("studentName")?.value||"Adventurer").trim()||"Adventurer";
  const name=safeName(raw);
  const correct=Math.round(xp/10);
  const accuracy=Math.round((xp/(TOTAL*10))*100);
  document.getElementById("quest").innerHTML=
    '<div class="results">'+
    '<div><div class="result-big">🏆💰🐉</div>'+
    '<h2 class="sectiontitle">QUEST COMPLETE!</h2>'+
    '<p class="prompt"><b>'+name+'</b>, you unlocked the treasure!</p></div>'+
    '<div class="result-card">'+
    '<div class="stats"><div class="stat">Challenges: '+TOTAL+'</div><div class="stat">Correct: '+correct+'</div><div class="stat">XP: '+xp+' / '+(TOTAL*10)+'</div><div class="stat">Accuracy: '+accuracy+'%</div></div>'+
    '<div class="checklist"><p><b>My place-value strategy:</b></p>'+
    '<label><input type="checkbox"> I compared hundreds first.</label>'+
    '<label><input type="checkbox"> I compared tens when needed.</label>'+
    '<label><input type="checkbox"> I compared ones when needed.</label></div>'+
    '</div>'+
    '<p class="prompt">Show this screen to your teacher or use <b>Print / Save Results</b> to submit it in Schoology.</p>'+
    '<div class="result-actions"><button class="primary" id="print">🖨️ Print / Save Results</button><button id="again">⚔️ Start Another Quest</button></div>'+
    '</div>';
  document.getElementById("print").addEventListener("click",()=>window.print());
  document.getElementById("again").addEventListener("click",()=>{
    challenge=0; xp=0; streak=0; update(); next();
  });
}
update();
next();
</script>
</body>
</html>
