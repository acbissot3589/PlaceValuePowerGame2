<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Place Value Power Challenge - Regular</title>
<style>
:root{--ink:#172033;--muted:#536174;--paper:#fffdf7;--panel:#f5efe0;--accent:#6b4eff;--accent2:#e9e1ff;--border:#cfc5ad}
*{box-sizing:border-box} body{margin:0;background:linear-gradient(#eef2f7,#fff);font-family:Arial,Helvetica,sans-serif;color:var(--ink)}
.app{max-width:900px;margin:0 auto;padding:20px}.hero{background:var(--paper);border:2px solid var(--border);border-radius:24px;padding:22px;text-align:center}
h1{font-size:clamp(2rem,6vw,3.3rem);margin:0 0 5px;font-weight:900}.ribbon{display:inline-block;background:var(--ink);color:#fff;padding:7px 15px;border-radius:999px;font-weight:800;font-size:.85rem}
.subtitle{margin:10px auto 0;color:var(--muted);max-width:700px;line-height:1.45}.stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:18px 0}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:9px 15px;font-weight:800}.progress{height:10px;background:#e8e4da;border-radius:99px;overflow:hidden;margin:16px 0}
.progressbar{height:100%;width:0;background:var(--accent);transition:width .2s}.quest{margin-top:18px;background:var(--paper);border:2px solid var(--border);border-radius:24px;padding:22px}
.sectiontitle{text-align:center;font-size:1.5rem;font-weight:900;margin:0 0 5px}.prompt{text-align:center;color:var(--muted);line-height:1.45;margin:0 auto 15px;max-width:720px}
.numbers{display:flex;gap:16px;justify-content:center;align-items:center;flex-wrap:wrap;margin:18px 0}.num{font-size:clamp(2rem,7vw,3.8rem);font-weight:900;background:#fff;border:2px solid var(--border);border-radius:18px;padding:15px 25px;min-width:150px;text-align:center}
.symbol{font-size:2rem;font-weight:900}.buttons{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
button{font:inherit;font-weight:800;min-height:48px;border:2px solid var(--border);border-radius:13px;background:#fff;padding:10px 18px;cursor:pointer;color:var(--ink)}
button:focus{outline:3px solid var(--accent2);outline-offset:2px}.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.choice{font-size:1.5rem;min-width:85px}.feedback{min-height:42px;text-align:center;font-weight:900;font-size:1.1rem;padding:12px}
.hintbox{background:var(--accent2);border-radius:15px;padding:13px;margin:10px auto;max-width:680px;line-height:1.5}.hidden{display:none}
.order{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:620px;margin:18px auto}.slot{min-height:70px;border:2px dashed var(--border);border-radius:15px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:1.45rem;font-weight:900}
.order-buttons{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.order-buttons button{font-size:1.2rem;min-width:90px}
.footer{text-align:center;color:var(--muted);font-size:.9rem;margin-top:16px}
.results{max-width:720px;margin:0 auto}.result-card{background:#fff;border:2px solid var(--border);border-radius:18px;padding:18px;margin:14px 0}
.result-big{font-size:clamp(2rem,7vw,4rem);font-weight:900}.checklist{text-align:left;max-width:520px;margin:15px auto}.checklist label{display:block;padding:10px 0;font-weight:700}
.result-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:16px}
@media print{body{background:#fff}.hero{box-shadow:none}.result-actions,.footer{display:none}}

@media(max-width:560px){.app{padding:10px}.hero,.quest{padding:16px}.order{grid-template-columns:1fr}.num{min-width:125px}}

</style></head>
<body><div class="app">
<header class="hero"><div class="ribbon">⚔️ Regular Quest • compare • order • explain</div><h1>PLACE VALUE POWER</h1><div style="font-weight:900;font-size:1.25rem">THE COMPARISON CHALLENGE</div>
<p class="subtitle">Use place value to compare and order 3-digit numbers. Compare hundreds first, then tens, then ones.</p>
<div style="max-width:520px;margin:14px auto 0;text-align:left">
<label for="studentName" style="font-weight:800;display:block;margin-bottom:6px">Adventurer Name</label>
<input id="studentName" type="text" maxlength="50" placeholder="Type your first name"
style="width:100%;padding:12px;border:2px solid var(--border);border-radius:12px;font:inherit;background:#fff;color:var(--ink)">
</div>
<div class="stats"><div class="stat" id="challenge"></div><div class="stat" id="xp">XP: 0</div><div class="stat" id="streak">Streak: 0</div></div>
<div class="progress"><div class="progressbar" id="bar"></div></div></header>
<main class="quest" id="quest" aria-live="polite"></main>
<div class="footer">Remember: <b>Hundreds → Tens → Ones</b></div></div>
<script>
const COMPARE=[[245, 324], [618, 601], [472, 427], [305, 350], [781, 718], [563, 536], [209, 290], [640, 604], [398, 389], [517, 571], [826, 862], [431, 413], [705, 750], [276, 267], [954, 945], [680, 608]], ORDER=[[241, 315, 198], [472, 427, 504], [681, 618, 609], [305, 350, 325], [792, 729, 772], [456, 465, 405], [813, 831, 803], [264, 246, 286], [591, 519, 561], [704, 740, 714], [348, 384, 328], [625, 652, 605], [219, 291, 249], [870, 807, 780], [536, 563, 503], [412, 421, 402]], TOTAL=16;
let challenge=0,xp=0,streak=0,locked=false,current=null;
const root=document;
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function relation(a,b){return a===b?"=":(a>b?">":"<")}
function hint(a,b){
 const ah=Math.floor(a/100),bh=Math.floor(b/100),at=Math.floor(a/10)%10,bt=Math.floor(b/10)%10,ao=a%10,bo=b%10;
 if(ah!==bh)return "Compare the <b>hundreds</b>: "+ah+" vs. "+bh+". The greater hundreds digit makes the greater number.";
 if(at!==bt)return "The hundreds match. Compare the <b>tens</b>: "+at+" vs. "+bt+".";
 return "The hundreds and tens match. Compare the <b>ones</b>: "+ao+" vs. "+bo+".";
}
function update(){
 document.getElementById("challenge").textContent="Challenge "+challenge+" / "+TOTAL;
 document.getElementById("xp").textContent="XP: "+xp;
 document.getElementById("streak").textContent="Streak: "+streak;
 document.getElementById("bar").style.width=Math.min(100,challenge/TOTAL*100)+"%";
}
function next(){
 if(challenge>=TOTAL){finishQuest();return}
 challenge++;locked=false;update();
 if(challenge%2===1){const p=pick(COMPARE);current={type:"compare",a:p[0],b:p[1]};renderCompare()}
 else{current={type:"order",nums:pick(ORDER)};renderOrder()}
}
function renderCompare(){
 const q=document.getElementById("quest"),a=current.a,b=current.b;
 q.innerHTML='<h2 class="sectiontitle">🏰 Challenge '+challenge+': Guard the Gate</h2>'+
 '<p class="prompt">Choose the symbol that makes the statement true.</p>'+
 '<div class="numbers"><div class="num">'+a+'</div><div class="symbol">?</div><div class="num">'+b+'</div></div>'+
 '<div class="buttons"><button class="choice" data-v="&lt;">&lt;</button><button class="choice" data-v="&gt;">&gt;</button><button class="choice" data-v="=">=</button></div>'+
 '<div class="feedback" id="feedback"></div><div class="buttons"><button id="hintBtn">💡 Place Value Hint</button></div>'+
 '<div class="hintbox hidden" id="hintBox"></div>';
 q.querySelectorAll("[data-v]").forEach(btn=>btn.addEventListener("click",()=>checkCompare(btn.dataset.v)));
 q.querySelector("#hintBtn").addEventListener("click",()=>{const x=q.querySelector("#hintBox");x.innerHTML="💡 "+hint(a,b);x.classList.remove("hidden")});
}
function checkCompare(got){
 if(locked)return;locked=true;const ok=got===relation(current.a,current.b),f=document.getElementById("feedback");
 if(ok){xp+=10;streak++;f.textContent="⭐ Correct! You used place value to open the gate."}
 else{streak=0;f.textContent="🛡️ Not quite. Compare hundreds first, then tens, then ones."}
 update();addContinue();
}
function renderOrder(){
 const q=document.getElementById("quest"),nums=shuffle(current.nums),picked=[];
 q.innerHTML='<h2 class="sectiontitle">🗺️ Challenge '+challenge+': Map the Numbers</h2>'+
 '<p class="prompt">Put the numbers in order from <b>least to greatest</b>.</p>'+
 '<div class="order"><div class="slot">1st</div><div class="slot">2nd</div><div class="slot">3rd</div></div>'+
 '<div class="order-buttons">'+nums.map(n=>'<button data-num="'+n+'">'+n+'</button>').join("")+'</div>'+
 '<div class="feedback" id="feedback"></div><div class="buttons"><button id="hintBtn">💡 Place Value Hint</button></div>'+
 '<div class="hintbox hidden" id="hintBox">💡 Compare hundreds first. If the hundreds match, compare tens. If those match, compare ones.</div>';
 q.querySelectorAll("[data-num]").forEach(btn=>btn.addEventListener("click",()=>{
  if(locked)return;const n=Number(btn.dataset.num);if(picked.includes(n))return;
  picked.push(n);btn.disabled=true;q.querySelectorAll(".slot")[picked.length-1].textContent=n;
  if(picked.length===3){locked=true;const correct=[...current.nums].sort((a,b)=>a-b),ok=picked.every((v,i)=>v===correct[i]),f=q.querySelector("#feedback");
   if(ok){xp+=10;streak++;f.textContent="⭐ Correct! The treasure map is unlocked."}else{streak=0;f.textContent="🛡️ Not quite. Look at the hundreds first."}
   update();addContinue();
  }
 }));
 q.querySelector("#hintBtn").addEventListener("click",()=>q.querySelector("#hintBox").classList.remove("hidden"));
}
function addContinue(){
 const wrap=document.createElement("div");wrap.className="buttons";
 const b=document.createElement("button");b.className="primary";b.textContent=challenge>=TOTAL?"🏆 Finish the Quest":"Continue the Quest →";b.addEventListener("click",next);
 wrap.appendChild(b);document.getElementById("quest").appendChild(wrap);
}
function finishQuest(){
 document.getElementById("bar").style.width="100%";
 const name=(document.getElementById("studentName")?.value||"Adventurer").trim()||"Adventurer";
 const correct=Math.round(xp/10);
 const accuracy=Math.round((xp/(TOTAL*10))*100);
 document.getElementById("quest").innerHTML='<div class="results">'+
 '<div style="text-align:center"><div class="result-big">🏆💰🐉</div>'+
 '<h2 class="sectiontitle">QUEST COMPLETE!</h2>'+
 '<p class="prompt"><b>'+escapeHtml(name)+'</b>, you unlocked the treasure!</p></div>'+
 '<div class="result-card">'+
 '<div class="stats"><div class="stat">Challenges: '+TOTAL+'</div><div class="stat">Correct: '+correct+'</div><div class="stat">XP: '+xp+' / '+(TOTAL*10)+'</div><div class="stat">Accuracy: '+accuracy+'%</div></div>'+
 '<div class="checklist"><p><b>My place-value strategy:</b></p>'+
 '<label><input type="checkbox"> I compared hundreds first.</label>'+
 '<label><input type="checkbox"> I compared tens when needed.</label>'+
 '<label><input type="checkbox"> I compared ones when needed.</label></div>'+
 '</div>'+
 '<p class="prompt">Show this results screen to your teacher or use Print / Save Results to submit it in Schoology.</p>'+
 '<div class="result-actions"><button class="primary" id="print">🖨️ Print / Save Results</button><button id="again">⚔️ Start Another Quest</button></div>'+
 '</div>';
 document.getElementById("print").addEventListener("click",()=>window.print());
 document.getElementById("again").addEventListener("click",()=>{challenge=0;xp=0;streak=0;update();next()});
}
function escapeHtml(str){
 return str.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
update();next();
</script></body></html>
